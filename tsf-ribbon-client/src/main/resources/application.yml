server:
  port: 18093

spring:
  application:
    name: tsf-ribbon-client
  cloud:
    consul:
      enabled: false
      config:
        enabled: false
        fail-fast: false
    # 负载均衡静态服务列表（Spring Cloud 2021 已移除 Netflix Ribbon，由 spring-cloud-loadbalancer
    # 接替，TSF 适配为 TsfBlockingLoadBalancerClient），多个实例轮询访问
    discovery:
      client:
        simple:
          instances:
            tsf-ribbon-server:
              - uri: http://localhost:18091
              - uri: http://localhost:18092
    loadbalancer:
      retry:
        enabled: true
        # false: POST 不自动重试，SocketException 直接上抛 → 复现现场报错调用栈（默认）
        # true : GET/POST 失败自动换实例重试 → 报错后自动恢复
        retry-on-all-operations: false
        max-retries-on-same-service-instance: 0
        max-retries-on-next-service-instance: 1
        # 客户端连接缓存说明（毕昇 1.8.0_452 实测）: nap 来自服务端 Keep-Alive: timeout=60
        # 响应头（60s），而非旧认知的固定 5s——故空闲 ~60s 的调用存在复用竞态窗口。

feign:
  tsf:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 10000

logging:
  level:
    root: INFO
  pattern:
    level: "%-5level [${spring.application.name},%mdc{trace_id},%mdc{span_id},]"

# 本地自测（无 TSF 控制台时避免注册中心连接报错）
tsf_namespace_id: default_namespace
eureka.client.enabled: false
